<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SecureAuth | Login</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

    <main class="auth-container">

        <section class="auth-card">

            <div class="brand">
                <div class="brand-icon">🛡️</div>

                <h1>SecureAuth</h1>

                <p>
                    Multi-Factor Authentication Demo
                </p>
            </div>


            <div class="login-section">

                <h2>Welcome Back</h2>

                <p class="subtitle">
                    Sign in to access your secure account.
                </p>


                <form method="POST">

                    <div class="form-group">

                        <label for="username">
                            Username
                        </label>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Enter your username"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="login-button"
                    >
                        Sign In
                    </button>

                </form>


                <div class="security-notice">

                    <span>🔐</span>

                    <p>
                        Your account is protected with
                        multi-factor authentication.
                    </p>

                </div>

            </div>

        </section>

    </main>

</body>
</html>
